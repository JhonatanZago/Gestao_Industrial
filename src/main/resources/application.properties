spring.application.name=SistemaGestaoIndustrial
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_gestao_industrial}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=${IMPORT_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${IMPORT_MAX_REQUEST_SIZE:10MB}
app.importacao.max-linhas=${IMPORT_MAX_LINHAS:10000}
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-seconds=${JWT_EXPIRATION:3600}
security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
security.bootstrap-admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
security.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
security.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
security.bootstrap-admin.empresa-id=${BOOTSTRAP_ADMIN_EMPRESA_ID:}
security.bootstrap-admin.nome=${BOOTSTRAP_ADMIN_NOME:Administrador inicial}
security.password.min-length=${PASSWORD_MIN_LENGTH:8}
reports.max-period-days=${REPORT_MAX_PERIOD_DAYS:366}
reports.max-top=${REPORT_MAX_TOP:100}
reports.max-rows=${REPORT_MAX_ROWS:10000}
reports.insight-variation-percent=${REPORT_INSIGHT_VARIATION_PERCENT:20}
reports.standard-coverage-threshold-percent=${REPORT_STANDARD_COVERAGE_THRESHOLD_PERCENT:80}
quality.max-production-duration=${QUALITY_MAX_PRODUCTION_DURATION:PT24H}
quality.future-tolerance=${QUALITY_FUTURE_TOLERANCE:P1D}
quality.short-production-duration=${QUALITY_SHORT_PRODUCTION_DURATION:PT5M}
quality.suspicious-rate-per-hour=${QUALITY_SUSPICIOUS_RATE_PER_HOUR:10000}
quality.suspicious-quantity=${QUALITY_SUSPICIOUS_QUANTITY:100000}
quality.coverage-alert-threshold-percent=${QUALITY_COVERAGE_ALERT_THRESHOLD_PERCENT:80}
quality.duplicate-tolerance=${QUALITY_DUPLICATE_TOLERANCE:PT0S}
quality.max-period-days=${QUALITY_MAX_PERIOD_DAYS:366}
quality.max-page-size=${QUALITY_MAX_PAGE_SIZE:100}
quality.max-records=${QUALITY_MAX_RECORDS:10000}
quality.max-duplicate-groups=${QUALITY_MAX_DUPLICATE_GROUPS:10000}
ai.enabled=${AI_ENABLED:false}
ai.max-question-length=${AI_MAX_QUESTION_LENGTH:2000}
ai.max-tool-calls=${AI_MAX_TOOL_CALLS:8}
ai.max-tool-results=${AI_MAX_TOOL_RESULTS:1000}
ai.timeout=${AI_TIMEOUT:PT30S}
ai.max-output-tokens=${AI_MAX_OUTPUT_TOKENS:1000}
ai.max-retrieved-documents=${AI_MAX_RETRIEVED_DOCUMENTS:8}
ai.max-document-bytes=${AI_MAX_DOCUMENT_BYTES:5242880}
ai.max-requests-per-minute=${AI_MAX_REQUESTS_PER_MINUTE:30}
ai.retry-attempts=${AI_RETRY_ATTEMPTS:1}
ai.timezone=${AI_TIMEZONE:America/Sao_Paulo}
ai.pdf-enabled=${AI_PDF_ENABLED:false}
ai.chunk-size=${AI_CHUNK_SIZE:1200}
ai.chunk-overlap=${AI_CHUNK_OVERLAP:100}
