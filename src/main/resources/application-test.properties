spring.datasource.url=jdbc:h2:mem:gestaoindustrial;MODE=PostgreSQL;DB_CLOSE_DELAY=0;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.flyway.enabled=true
security.jwt.secret=test-only-secret-key-with-at-least-32-bytes
security.jwt.expiration-seconds=3600
security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
security.login.max-attempts-per-minute=10
security.bootstrap-admin.enabled=false
security.password.min-length=8
reports.max-period-days=366
reports.max-top=100
reports.max-rows=10000
reports.insight-variation-percent=20
reports.standard-coverage-threshold-percent=80
ai.enabled=false
ai.max-question-length=2000
ai.max-tool-calls=8
ai.max-tool-results=1000
ai.timeout=PT30S
ai.max-output-tokens=1000
ai.max-retrieved-documents=8
ai.max-document-bytes=5242880
ai.max-requests-per-minute=30
ai.retry-attempts=1
ai.timezone=America/Sao_Paulo
ai.pdf-enabled=false
ai.chunk-size=1200
ai.chunk-overlap=100
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.prometheus.metrics.export.enabled=true
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=6
spring.datasource.hikari.minimum-idle=1
operations.max-payload-bytes=10485760
operations.shutdown-timeout=30s
operations.prometheus-enabled=true
operations.hikari-maximum-pool-size=6
operations.hikari-minimum-idle=1
operations.hikari-connection-timeout=30s
operations.hikari-idle-timeout=10m
operations.hikari-max-lifetime=30m
operations.remote-connect-timeout=2s
operations.remote-response-timeout=30s
operations.remote-max-attempts=2
operations.remote-backoff=200ms
operations.remote-circuit-failure-threshold=5
operations.remote-circuit-open-duration=30s
app.importacao.max-zip-entry-bytes=20971520
app.importacao.max-zip-entries=512
app.importacao.min-inflate-ratio=0.01
industrial.importacao.automatica.enabled=false
industrial.importacao.automatica.debounce-ms=50
industrial.importacao.automatica.estabilidade.interval-ms=10
industrial.importacao.automatica.estabilidade.verificacoes-estaveis=2
industrial.importacao.automatica.estabilidade.timeout-segundos=2
industrial.importacao.automatica.reconciliacao.enabled=false
industrial.importacao.automatica.reconciliacao.cron=0 0 18 * * *
industrial.importacao.automatica.reconciliacao.zone=America/Sao_Paulo
